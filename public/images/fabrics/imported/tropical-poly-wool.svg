<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fabricBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3240"/>
      <stop offset="50%" stop-color="#1e222c"/>
      <stop offset="100%" stop-color="#14171f"/>
    </linearGradient>
    <pattern id="weavePattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 6 6 L 12 0 M 0 6 L 6 12 L 12 6" fill="none" stroke="#3b4457" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="goldSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6b8"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8a6d23"/>
    </linearGradient>
    <filter id="fabricDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fabric Drape Background -->
  <rect width="600" height="600" fill="#0d0e12" rx="16"/>

  <!-- Fabric Swatch Panel -->
  <g filter="url(#fabricDrop)">
    <rect x="25" y="25" width="550" height="550" rx="14" fill="url(#fabricBase)"/>
    <rect x="25" y="25" width="550" height="550" rx="14" fill="url(#weavePattern)" opacity="0.85"/>
  </g>

  <!-- Fabric Surface Shading / Realistic Folds -->
  <path d="M 25 150 Q 300 220 575 140 L 575 300 Q 300 380 25 300 Z" fill="#ffffff" opacity="0.04"/>
       <path d="M 25 280 Q 300 350 575 270 L 575 420 Q 300 480 25 410 Z" fill="#000000" opacity="0.25"/>

  <!-- Woven Selvedge Border Edge -->
  <rect x="25" y="475" width="550" height="100" rx="0" fill="#111318" opacity="0.92"/>
  <line x1="25" y1="475" x2="575" y2="475" stroke="url(#goldSealGrad)" stroke-width="2.5"/>
  <line x1="25" y1="479" x2="575" y2="479" stroke="#c5a059" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Selvedge Gold Lettering -->
  <text x="45" y="505" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" letter-spacing="3" fill="#f5e6b8">ABDULLAH MELODY TAILOR</text>
  <text x="45" y="528" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="700" fill="#ffffff">Tropical Poly-Wool Blend</text>
  <text x="45" y="550" font-family="'Inter', sans-serif" font-size="11" fill="#9da7b3">All-Season 280 GSM • Wrinkle-Resistant Fine Twill Suiting</text>

  <!-- Golden Quality Seal / Badge -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="0" r="32" fill="#1b1f28" stroke="url(#goldSealGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#c5a059" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="0" y="-8" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#c5a059" text-anchor="middle" letter-spacing="1">Imported</text>
    <text x="0" y="6" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#f5e6b8" text-anchor="middle">280 GSM</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#8f9aa6" text-anchor="middle">POLY-WOOL</text>
  </g>

  <!-- Header Category Tag -->
  <rect x="45" y="45" width="130" height="24" rx="4" fill="#141720" opacity="0.85" stroke="#c5a059" stroke-width="1"/>
  <text x="110" y="61" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#f5e6b8" text-anchor="middle">IMPORTED SUITING</text>
</svg>