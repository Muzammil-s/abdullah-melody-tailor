<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15171d"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="fabricShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f232b" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="16"/>
  <rect width="500" height="500" fill="url(#grid)" rx="16" opacity="0.6"/>
  
  <!-- Outer Luxury Framing -->
  <rect x="12" y="12" width="476" height="476" rx="12" fill="none" stroke="#2a303c" stroke-width="1.2"/>
  <rect x="18" y="18" width="464" height="464" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.35" stroke-dasharray="6,4"/>

  <!-- Top Header / Branding -->
  <text x="32" y="45" font-family="'Cinzel', 'Georgia', serif" font-size="11" letter-spacing="3" fill="#d4af37" font-weight="700">ABDULLAH MELODY TAILOR</text>
  <rect x="340" y="30" width="128" height="22" rx="4" fill="#1b1f27" stroke="#c5a059" stroke-width="0.8"/>
  <text x="404" y="45" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#f5e6b8" text-anchor="middle">PANCHA 02</text>

  <!-- Art Canvas -->
  <g id="art" transform="translate(0, 10)">
    
    <path d="M 180 150 L 195 310 L 305 310 L 320 150 Z" fill="url(#fabricShade)" stroke="#3a4252" stroke-width="1.5"/>
    <rect x="193" y="280" width="114" height="40" fill="#222731" stroke="#c5a059" stroke-width="1.8"/>
    <!-- 5 Needle stitch lines -->
    <line x1="195" y1="288" x2="305" y2="288" stroke="#f5e6b8" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="195" y1="294" x2="305" y2="294" stroke="#f5e6b8" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="195" y1="300" x2="305" y2="300" stroke="#f5e6b8" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="195" y1="306" x2="305" y2="306" stroke="#f5e6b8" stroke-width="0.8" stroke-dasharray="3,2"/>
    <line x1="195" y1="312" x2="305" y2="312" stroke="#f5e6b8" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="250" y="240" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">5-Row Precision Stitching</text>
    
  </g>

  <!-- Title & Specs Bottom Area -->
  <g transform="translate(0, 412)">
    <line x1="32" y1="0" x2="468" y2="0" stroke="#252b36" stroke-width="1"/>
    <line x1="32" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <text x="32" y="27" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.5">Pancha: Multi-Line Stitch</text>
    <text x="32" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#9da7b3" letter-spacing="0.2">5 to 7 dense parallel needle rows for added weight & crisp drape</text>
  </g>
</svg>