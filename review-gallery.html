      padding: 0;

    .header-top {

      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;

    .brand-title h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 2.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
      font-weight: 700;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: #141822;
      border: 1px solid #232936;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .stat-pill strong {
      font-size: 15px;
      color: #fff;
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-user { background: var(--accent-user); box-shadow: 0 0 8px var(--accent-user); }
    .dot-curated { background: var(--accent-curated); box-shadow: 0 0 8px var(--accent-curated); }
    .dot-svg { background: var(--accent-svg); box-shadow: 0 0 8px var(--accent-svg); }

    /* Controls bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      background: #151922;
      border: 1px solid #262d3d;
      border-radius: 8px;
      padding: 10px 14px 10px 36px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: #788295;
    }

    .filters-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      max-width: 100%;
    }

    .filter-btn {
      background: #141822;
      border: 1px solid #222938;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #202738;
      color: #ffffff;
      border-color: var(--gold-primary);
    }

    /* Main Container */
    main {
      max-width: 1680px;
      margin: 0 auto;
      padding: 30px 40px 80px;
    }

    .category-section {
      margin-bottom: 50px;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid #1f2533;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .category-title-group h2 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 1px;
      color: #ffffff;
      font-weight: 700;
    }

    .category-title-group p {
      font-size: 13px;
      color: var(--text-muted);
    }

      border: 1px solid #283142;
      color: var(--gold-light);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .cards-grid {

      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
    }

    .asset-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
    }

    .asset-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.7);
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 290px;
      background: #0d0f14;
      overflow: hidden;
      cursor: pointer;
    }

    .card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.4s ease;
    }

    .asset-card:hover .card-thumb-wrap img {
      transform: scale(1.04);
    }

    .source-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-local-user {
      background: rgba(229, 184, 76, 0.9);
      color: #121008;
    }

    .badge-web-curated {
      background: rgba(46, 196, 182, 0.9);
      color: #03211e;
    }

    .badge-technical-svg {
      background: rgba(72, 149, 239, 0.9);
      color: #09172e;
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 11.5px;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .card-specs {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .tag-item {
      background: #10131a;
      border: 1px solid #1e2430;
      color: #8994a5;
      font-size: 9.5px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1d222e;
      padding-top: 10px;
      margin-top: auto;
      gap: 8px;
    }

    .path-text {
      font-size: 10px;
      font-family: monospace;
      color: #6c788c;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;

    .card-btn {
      background: #181d27;
      border: 1px solid #283142;
      color: var(--gold-light);
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 10.5px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;

    .card-btn:hover {
      background: var(--gold-primary);
      color: #000000;
      border-color: var(--gold-primary);
    }

      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.88);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;

    .modal-overlay.active {
      display: flex;
    }

      border: 1px solid #2b3342;
      border-radius: 14px;

      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);

      transition: all 0.3s;
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {

      transform: translateY(0);

rceType": "local-user", "relativePath": "/images/unclassified/long-coat-alternate-perspective.jpg", "filename": "long-coat-alternate-perspective.jpg", "specs": "Three-quarter perspective of tailored long coat in the shop.", "tags": ["Perspective", "Local-User-Asset"]}, {"id": "two-button-suit-alternate-angle", "title": "Two-Button Suit Coat (Fitting Angle)", "subtitle": "Alternative Stance Photo", "sourceType": "local-user", "relativePath": "/images/unclassified/two-button-suit-alternate-angle.jpg", "filename": "two-button-suit-alternate-angle.jpg", "specs": "Straight-on fitting shot of 2-button navy check coat on form.", "tags": ["Coat", "Fitting", "Local-User-Asset"]}]}]};

    let activeFilter = 'all';
    let activeSourceFilter = null;
    let searchQuery = '';
    let currentOpenItem = null;

    const galleryContainer = document.getElementById('galleryContainer');
    const searchInput = document.getElementById('searchInput');
    const filterPills = document.getElementById('filterPills');
    const lightboxModal = document.getElementById('lightboxModal');
    const modalClose = document.getElementById('modalClose');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalSpecs = document.getElementById('modalSpecs');
    const modalPath = document.getElementById('modalPath');
    const modalCopyBtn = document.getElementById('modalCopyBtn');
    const imageSwapInput = document.getElementById('imageSwapInput');
    const toastNotice = document.getElementById('toastNotice');

    function showToast(msg) {
      toastNotice.textContent = msg;
      toastNotice.classList.add('show');
      setTimeout(() => toastNotice.classList.remove('show'), 2200);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Path copied: ' + text);
      }).catch(() => {
        showToast('Copied: ' + text);
      });
    }

    function renderGallery() {
      galleryContainer.innerHTML = '';

      manifest.categories.forEach(category => {
        // Category filtering
        if (activeFilter !== 'all' && activeFilter !== category.id) return;

        // Item filtering
        const matchingItems = category.items.filter(item => {
          if (activeSourceFilter && item.sourceType !== activeSourceFilter) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          const title = item.title.toLowerCase();
          const subtitle = (item.subtitle || '').toLowerCase();
          const specs = (item.specs || '').toLowerCase();
          const tags = (item.tags || []).join(' ').toLowerCase();
          return title.includes(q) || subtitle.includes(q) || specs.includes(q) || tags.includes(q);
        });

        if (matchingItems.length === 0) return;

        const section = document.createElement('section');
        section.className = 'category-section';

        section.innerHTML = `
          <div class="category-header">
            <div class="category-title-group">
              <h2>${category.name}</h2>
              <p>${category.description}</p>
            </div>
            <span class="cat-count-badge">${matchingItems.length} ${matchingItems.length === 1 ? 'Asset' : 'Assets'}</span>
          </div>
          <div class="cards-grid" id="grid-${category.id}"></div>
        `;

        const grid = section.querySelector('.cards-grid');

        matchingItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'asset-card';
          card.dataset.id = item.id;

          const sourceBadgeClass = item.sourceType === 'local-user' 
            ? 'badge-local-user' 
            : item.sourceType === 'web-curated' 
              ? 'badge-web-curated' 
              : 'badge-technical-svg';

          const sourceLabel = item.sourceType === 'local-user' 
            ? 'Local User' 
            : item.sourceType === 'web-curated' 
              ? 'Curated Photo' 
              : 'Technical SVG';

          // Correct relative path for browser viewing directly from root
          const relativeAssetPath = '.' + item.relativePath;

          card.innerHTML = `
            <div class="card-thumb-wrap">
              <span class="source-badge ${sourceBadgeClass}">${sourceLabel}</span>
              <img src="${relativeAssetPath}" alt="${item.title}" loading="lazy" id="img-${item.id}">
            </div>
            <div class="card-content">
              <h3 class="card-title">${item.title}</h3>
              <div class="card-subtitle">${item.subtitle || ''}</div>
              <p class="card-specs">${item.specs || ''}</p>
              <div class="card-tags">
                ${(item.tags || []).map(t => `<span class="tag-item">${t}</span>`).join('')}
              </div>
              <div class="card-footer">
                <span class="path-text" title="${item.relativePath}">${item.relativePath}</span>
                <button class="card-btn copy-btn" data-path="${item.relativePath}">Copy</button>
                <button class="card-btn zoom-btn">Inspect</button>
              </div>
            </div>
          `;

          // Zoom / Inspect click
          card.querySelector('.card-thumb-wrap').addEventListener('click', () => openModal(item, relativeAssetPath));
          card.querySelector('.zoom-btn').addEventListener('click', () => openModal(item, relativeAssetPath));

          // Copy button
          card.querySelector('.copy-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            copyToClipboard(item.relativePath);
          });

          grid.appendChild(card);
        });

        galleryContainer.appendChild(section);
      });

      if (galleryContainer.children.length === 0) {
        galleryContainer.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <h3 style="color: #fff; margin-bottom: 8px;">No matching assets found</h3>
            <p>Try clearing your search query or switching filters.</p>
          </div>
        `;
      }
    }

    function openModal(item, assetPath) {
      currentOpenItem = item;
      modalImage.src = assetPath;
      modalTitle.textContent = item.title;
      modalSubtitle.textContent = item.subtitle || '';
      modalSpecs.textContent = item.specs || '';
      modalPath.textContent = item.relativePath;
      lightboxModal.classList.add('active');
    }

    modalClose.addEventListener('click', () => {
      lightboxModal.classList.remove('active');
    });

    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) {
        lightboxModal.classList.remove('active');
      }
    });

    modalCopyBtn.addEventListener('click', () => {
      if (currentOpenItem) {
        copyToClipboard(currentOpenItem.relativePath);
      }
    });

    // Live local image swap preview for testing
    imageSwapInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && currentOpenItem) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const dataUrl = event.target.result;
          modalImage.src = dataUrl;
          const cardImg = document.getElementById('img-' + currentOpenItem.id);
          if (cardImg) {
            cardImg.src = dataUrl;
          }
          showToast(`Previewing "${file.name}" in place of ${currentOpenItem.id}!`);
        };
        reader.readAsDataURL(file);
      }
    });

    // Search filter
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderGallery();
    });

    // Category / Source filter buttons
    filterPills.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (btn.dataset.source) {
        activeSourceFilter = btn.dataset.source;
        activeFilter = 'all';
      } else {
        activeSourceFilter = null;
        activeFilter = btn.dataset.filter || 'all';
      }

      renderGallery();
    });

    // Initialize
    renderGallery();
  </script>
